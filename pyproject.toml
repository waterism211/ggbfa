[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ggbfa"
dynamic = ["version"]
description = "Graph-guided Bayesian factor analysis (gg-BFA) for high-dimensional data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.6,<14"]
plot = ["matplotlib>=3.6,<4"]
test = ["pytest>=7,<9"]

[tool.setuptools.dynamic]
version = {attr = "ggbfa._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
